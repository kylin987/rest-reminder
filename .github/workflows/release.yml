name: 打包发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 选择版本号
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 写入版本号
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Support/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Support/Info.plist

      - name: 测试
        run: ./scripts/test.sh

      - name: 打包
        run: |
          ./scripts/build.sh --share
          cp "dist/休息提醒.dmg" dist/rest-reminder-macos.dmg
          lipo -info "dist/休息提醒.app/Contents/MacOS/RestReminder"

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.version }}"
          printf '%s\n' \
            "macOS 14 或更新版本，Apple 芯片和 Intel 芯片都可以。" \
            "" \
            "下载 rest-reminder-macos.dmg，打开后把「休息提醒」拖进「应用程序」。" \
            "第一次打开如果被系统拦住，按镜像里的「打开说明.txt」处理。" \
            > release-notes.md
          gh release create "$TAG" dist/rest-reminder-macos.dmg \
            --title "休息提醒 $VERSION" \
            --notes-file release-notes.md \
            --latest
